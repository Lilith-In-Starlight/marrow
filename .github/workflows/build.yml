on: [push, pull_request]

name: Build

jobs:
  client:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "client_${{ matrix.os }}"

      - name: Build client
        run: cargo build --release -p marrow

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marrow_${{ runner.os }}
          path: |
            ./target/release/marrow
            ./target/release/marrow.exe
          if-no-files-found: ignore